[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["frontend", ".local_data", "data-btc", "backend/migrations", "codebase/excel_reader.py", "codebase/tools.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
